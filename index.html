<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TK Reward</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
}
.header{
    background:#111;
    color:white;
    padding:25px;
    text-align:center;
}
.balance{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:15px;
    text-align:center;
}
.points{
    font-size:35px;
    font-weight:bold;
}
.task{
    background:white;
    margin:15px 20px;
    padding:20px;
    border-radius:15px;
}
button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:17px;
}
button:disabled{
    background:#999;
}
</style>
<link rel="manifest" href="./manifest.json">
</head>
</head>
<body>

<div class="header">
    <h1>TK REWARD</h1>
    <p>Complete tasks and collect points</p>
</div>

<div class="balance">
    <div>তোমার Points</d
                        iv>
    <div class="points" id="points">0</div>
</div>

<div class="task">
    <h2>Task 1</h2>
    <p>App সম্পর্কে একটি ছোট তথ্য পড়ো।</p>
    <button onclick="completeTask(this)">Compl
        ete +10</button>
</div>

<div class="task">
    <h2>Task 2</h2>
    <p>আজকের প্রশ্নের উত্তর দাও।</p>
    <button onclick="completeTask(this)">Complete +20</button>
</div>

<script>
let points = Number(localStorage.getItem("points")) || 0;

document.getElementById("points").innerText = points;

function completeTask(button){
    let reward = button.innerText.includes("20") ? 20 : 10;

    points += reward;

    localStorage.setItem("points", points);

    document.getElementById("points").innerText = points;

    button.innerText = "Completed ✓";
    button.disabled = true;
}
</script>

</body>
</html>
